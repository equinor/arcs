[project]
name = "arcs"
version = "1.5.0"
description = "Automated reactions for CO2 storage"
requires-python = ">=3.12, <3.15"
authors = [
  { name = "CCS Data & Digital Team", email = "fg_CCS_Data_Digital@equinor.com" },
  { name = "Benjamin A. D. Williamson", email = "benjamin.williamson@ntnu.no" },
]
license = "MIT"
readme = "README.md"
classifiers=[
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "ase",
  "pymatgen",
  "scipy",
  "numpy",
  "chempy",
  "tqdm",
  "fastapi",
  "uvicorn",
  "pydantic",
  "python-dotenv",
  "azure-monitor-opentelemetry",
  "opentelemetry-instrumentation-httpx",
  "opentelemetry-instrumentation-fastapi",
]

[project.optional-dependencies]
docs = ["mkdocs"]

[dependency-groups]
dev = [
  "pytest",
  "ruff < 0.16",
  "pytest-snapshot",
  "mypy",
  "types-tqdm",
  "types-psutil",
  "pandas-stubs",
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
  "chempy",
  "chempy.equilibria",
  "networkx",
]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
